<svg width="270" height="60" viewBox="0 0 270 60" xmlns="http://www.w3.org/2000/svg">
  <style>
    .terminal-text {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-weight: 600;
      font-size: 26px;
    }
    .cursor {
      fill: #C99E56; /* Cursor dorado parpadeante */
      animation: blink 1s infinite;
    }
    .cmd-main {
      fill: #FFFFFF;
    }
    .cmd-num {
      fill: #C99E56;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>

  <!-- Texto del comando: > FernandoDev19_ -->
  <text x="15" y="42" class="terminal-text cmd-main">&gt; <tspan class="cmd-main">Fernando</tspan><tspan class="cmd-main">Dev</tspan><tspan class="cmd-num">19</tspan></text>
  
  <!-- El cursor "_" -->
  <rect x="250" y="21" width="12" height="24" class="cursor"/>

</svg>